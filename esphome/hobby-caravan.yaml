esphome:
  name: hobby-caravan
  friendly_name: hobby-caravan
  min_version: 2026.4.0
  name_add_mac_suffix: false
  # verze tohohle projektu (ne verze ESPHome) - v HA v info o zarizeni
  project:
    name: paveltresnak.hobby-caravan
    version: "1.2.0"

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: my_components
    components: [fendt_caravan]

esp32_ble_tracker:
  scan_parameters:
    active: true
    # Signal na HobbyConnect je na hrane (-95 az -100 dBm) a s defaultnim oknem
    # ESP posloucha jen 30 ms z kazdych 320 ms, takze mu vetsina inzeratu utece
    # a spojeni se po restartu nenavaze. 200/320 ms = ~62 % casu.
    interval: 320ms
    window: 200ms
    connection_scan_window: 200ms

ble_client:
  # MAC HobbyConnectu je u každého karavanu jiná — doplň si ji do secrets.yaml
  # jako `caravan_mac` (jak ji najít, viz docs/flashing.md).
  - mac_address: !secret caravan_mac
    id: hobby_ble
    auto_connect: true
    on_connect:
      then:
        - binary_sensor.template.publish:
            id: karavan_ble_conn
            state: true
    on_disconnect:
      then:
        - binary_sensor.template.publish:
            id: karavan_ble_conn
            state: false

fendt_caravan:
  id: hobby_caravan_hub
  ble_client_id: hobby_ble

sensor:
  # ─── Diagnostika ESP (přidáno 2026-07-21) ────────────────────────────────
  # Důvod: když BLE spojení na karavan kolísá, nešlo rozhodnout PROČ —
  # chyběla data o síle signálu i o tom, jestli ESP nerestartoval.
  # Všechno je entity_category: diagnostic → v HA to sedí zvlášť a nepleteme
  # si to s hodnotami z karavanu.

  # Síla BLE signálu na karavan — hlavní podezřelý při kolísání spojení.
  # ⚠️ Čte se z advertisingu, takže během aktivního ble_client spojení může
  # být `unavailable` (připojené zařízení už nemusí inzerovat). Hodnota se
  # objeví právě ve chvíli, kdy je spojení rozpadlé — což je přesně ten
  # okamžik, který nás zajímá.
  - platform: ble_rssi
    mac_address: !secret caravan_mac
    name: "Karavan BLE signal"
    entity_category: diagnostic

  # WiFi signál ESP (jiná věc než BLE!) — kdyby vypadávalo i spojení do HA.
  - platform: wifi_signal
    name: "Karavan ESP WiFi signal"
    update_interval: 60s
    entity_category: diagnostic

  # Uptime = pozná restart ESP (výpadek proudu, watchdog, OTA).
  # Bez toho nešlo po výpadku 19.7. zjistit, jestli se ESP restartoval.
  - platform: uptime
    name: "Karavan ESP uptime"
    entity_category: diagnostic

  # ─── Data z karavanu (HobbyConnect přes BLE) ─────────────────────────────
  - platform: fendt_caravan
    parent_id: hobby_caravan_hub
    type: mcu_device
    id: hobby_unit
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: temp_in
    id: sens_temp_in
    name: "Karavan teplota vnitrni"
    filters:
      - throttle_average: 5s
      - round: 1
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: temp_out
    id: sens_temp_out
    name: "Karavan teplota venkovni"
    filters:
      - throttle_average: 5s
      - round: 1
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: batt_voltage
    id: sens_batt_voltage
    name: "Karavan baterie napeti"
    filters:
      - round: 2
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: batt_current
    id: sens_batt_current
    name: "Karavan baterie proud"
    filters:
      - round: 1
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: batt_soc
    id: sens_batt_soc
    name: "Karavan baterie nabiti"
    filters:
      - round: 0
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: batt_remaining
    id: sens_batt_remaining
    name: "Karavan baterie zbyva"
    filters:
      - round: 1
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: batt_temp
    id: sens_batt_temp
    name: "Karavan baterie teplota"
    filters:
      - round: 1
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: water_level
    id: sens_water
    name: "Karavan nadrz vody"
    unit_of_measurement: "%"
    icon: "mdi:water-percent"
    filters:
      - multiply: 25
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: fridge_temp
    id: fridge_temp_state
    internal: true
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: fridge_source
    id: fridge_source_state
    internal: true

# Auto-refresh (experiment 2026-07-01): periodicky re-request vsech promennych z jednotky
# -> overuji, zda WATER_LEVEL (a dalsi) prijdou cerstve bez fyzickeho sahnuti na panel
interval:
  - interval: 10min
    then:
      - lambda: 'id(hobby_caravan_hub).on_command_send("net-BT_VARS");'

binary_sensor:
  # Pravdivy stav BLE spojeni s karavanem (HobbyConnect) - rizen z ble_client
  # triggeru on_connect / on_disconnect (ble_client nema vlastni binary platformu).
  # POZOR: odlisit od "napajeni" (= LINE_EN, tj. 230V sit)! To neni stav spojeni.
  # device_class connectivity -> v HA se zobrazi "Connected / Disconnected".
  - platform: template
    id: karavan_ble_conn
    name: "Karavan spojeni"
    device_class: connectivity
    # debounce: kratky BLE vypadek neflappuje; "Disconnected" az po 20 s mimo dosah
    filters:
      - delayed_off: 20s
    on_release:
      # BLE mimo dosah -> hodnoty uz nejsou aktualni: zneplatnit na "Unavailable",
      # aby bylo zrejme, ze karavan neni v dosahu (a ovladani nema smysl).
      then:
        - lambda: |-
            id(sens_temp_in).publish_state(NAN);
            id(sens_temp_out).publish_state(NAN);
            id(sens_batt_voltage).publish_state(NAN);
            id(sens_batt_current).publish_state(NAN);
            id(sens_batt_soc).publish_state(NAN);
            id(sens_batt_remaining).publish_state(NAN);
            id(sens_batt_temp).publish_state(NAN);
            id(sens_water).publish_state(NAN);
            id(txt_napajeni).publish_state("");
    on_press:
      # po navratu do dosahu vynut cerstve nacteni vsech promennych
      then:
        - delay: 5s
        - lambda: 'id(hobby_caravan_hub).on_command_send("net-BT_VARS");'

switch:
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: main_switch
    name: "Karavan hlavni vypinac"
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: all_lights
    name: "Karavan svetla (vse)"
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: floor_heater
    name: "Karavan podlahove topeni"
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: kueche
    name: "Karavan svetlo kuchyn"
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: aussen
    name: "Karavan svetlo venku"
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: amb1
    name: "Karavan ambient 1"
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: amb2
    name: "Karavan ambient 2"
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: amb3
    name: "Karavan ambient 3"
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: fridge
    name: "Karavan lednice"
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: therme
    name: "Karavan bojler"
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: dusche
    name: "Karavan svetlo koupelna"

button:
  # Restart ESP na dálku — vynutí čerstvý BLE stack, když se spojení
  # na karavan zasekne. Do 2026-07-21 nebylo jak restartovat jinak než
  # OTA uploadem nebo fyzicky.
  - platform: restart
    name: "Karavan ESP restart"
    entity_category: config

text_sensor:
  # Verze ESPHome na ESP — ať je poznat, jestli běží to, co je v gitu.
  - platform: version
    name: "Karavan ESP verze"
    entity_category: diagnostic

  - platform: fendt_caravan
    parent_id: hobby_unit
    type: power_status
    id: txt_napajeni
    name: "Karavan napajeni"
  - platform: fendt_caravan
    parent_id: hobby_unit
    type: software_version
    name: "Karavan SW verze"

output:
  - platform: template
    type: float
    id: out_dim2
    write_action:
      - lambda: |-
          int level = (int) (state * 15.0f + 0.5f);
          char buf[28];
          snprintf(buf, sizeof(buf), "net-LIGHT_DIM2-%d", level);
          id(hobby_caravan_hub).on_command_send(std::string(buf));
  - platform: template
    type: float
    id: out_dim3
    write_action:
      - lambda: |-
          int level = (int) (state * 15.0f + 0.5f);
          char buf[28];
          snprintf(buf, sizeof(buf), "net-LIGHT_DIM3-%d", level);
          id(hobby_caravan_hub).on_command_send(std::string(buf));
  - platform: template
    type: float
    id: out_dim0
    write_action:
      - lambda: |-
          int level = (int) (state * 15.0f + 0.5f);
          char buf[28];
          snprintf(buf, sizeof(buf), "net-LIGHT_DIM0-%d", level);
          id(hobby_caravan_hub).on_command_send(std::string(buf));
  - platform: template
    type: float
    id: out_dim1
    write_action:
      - lambda: |-
          int level = (int) (state * 15.0f + 0.5f);
          char buf[28];
          snprintf(buf, sizeof(buf), "net-LIGHT_DIM1-%d", level);
          id(hobby_caravan_hub).on_command_send(std::string(buf));

light:
  - platform: monochromatic
    name: "Karavan svetlo obyvak"
    output: out_dim2
    gamma_correct: 1.0
    default_transition_length: 0s
  - platform: monochromatic
    name: "Karavan ambient zadni okno"
    output: out_dim3
    gamma_correct: 1.0
    default_transition_length: 0s
  - platform: monochromatic
    name: "Karavan postel vpravo"
    output: out_dim0
    gamma_correct: 1.0
    default_transition_length: 0s
  - platform: monochromatic
    name: "Karavan postel vlevo"
    output: out_dim1
    gamma_correct: 1.0
    default_transition_length: 0s

select:
  - platform: template
    name: "Karavan lednice rezim"
    id: fridge_source_select
    options:
      - "Auto"
      - "Plyn"
      - "12V"
      - "230V"
    update_interval: 15s
    lambda: |-
      if (!id(fridge_source_state).has_state()) return {};
      int i = (int) id(fridge_source_state).state;
      const char *opts[] = {"Auto", "Plyn", "12V", "230V"};
      if (i >= 0 && i < 4) return std::string(opts[i]);
      return {};
    set_action:
      - lambda: |-
          auto idx = id(fridge_source_select).index_of(x);
          int v = idx.has_value() ? (int) idx.value() : 0;
          char buf[32];
          snprintf(buf, sizeof(buf), "net-FRIDGE_SOURCE-%d", v);
          id(hobby_caravan_hub).on_command_send(std::string(buf));

number:
  - platform: template
    name: "Karavan lednice teplota"
    id: fridge_temp_number
    min_value: 1
    max_value: 5
    step: 1
    mode: slider
    update_interval: 15s
    lambda: |-
      if (id(fridge_temp_state).has_state()) return id(fridge_temp_state).state;
      return {};
    set_action:
      - lambda: |-
          char buf[32];
          snprintf(buf, sizeof(buf), "net-FRIDGE_TEMP-%d", (int) x);
          id(hobby_caravan_hub).on_command_send(std::string(buf));

text:
  - platform: template
    name: "Karavan RAW cmd"
    id: karavan_raw_cmd
    optimistic: true
    min_length: 0
    max_length: 80
    mode: text
    set_action:
      - lambda: 'id(hobby_caravan_hub).on_command_send(x);'
